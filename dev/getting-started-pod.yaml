---
# Development Pod: Liberty app + Keycloak sidecar
# Containers in the same Pod share localhost — Keycloak is reachable at localhost:8080.
#
# To deploy:
#   kubectl create configmap keycloak-realm --from-file=realm.json=dev/keycloak-realm.json
#   kubectl apply -f dev/getting-started-pod.yaml
#
# To get a token and hit /metrics (after port-forwarding):
#   kubectl port-forward pod/getting-started 9443:9443 8080:8080
#
#   TOKEN=$(curl -s -X POST \
#     http://localhost:8080/realms/liberty/protocol/openid-connect/token \
#     -d "grant_type=password&client_id=metrics-client&client_secret=metrics-secret&username=metrics&password=metrics" \
#     | jq -r .access_token)
#
#   curl -k -H "Authorization: Bearer $TOKEN" https://localhost:9443/metrics
#
# In production: remove the keycloak container and sso-override volume, and provide
# a Secret containing MP_JWT_ISSUER + MP_JWT_JWKS_URI pointing at your real IdP.
apiVersion: v1
kind: Pod
metadata:
  name: getting-started
  labels:
    app: getting-started
spec:
  initContainers:
    # Wait for Keycloak to finish importing the realm before Liberty starts
    - name: wait-for-keycloak
      image: curlimages/curl:8.8.0
      command:
        - sh
        - -c
        - |
          until curl -sf http://localhost:8080/realms/liberty/.well-known/openid-configuration; do
            echo "Waiting for Keycloak realm..."; sleep 5;
          done

  containers:
    - name: keycloak
      image: quay.io/keycloak/keycloak:25.0
      args: ["start-dev", "--import-realm"]
      env:
        - name: KEYCLOAK_ADMIN
          value: admin
        - name: KEYCLOAK_ADMIN_PASSWORD
          value: admin
      volumeMounts:
        - name: realm-config
          mountPath: /opt/keycloak/data/import
      ports:
        - containerPort: 8080

    - name: app
      image: icr.io/appcafe/open-liberty/samples/getting-started:latest
      volumeMounts:
        # Mount the dev SSO include; in production replace with a real sso.xml via Secret/ConfigMap
        - name: sso-override
          mountPath: /config/configDropins/overrides/sso.xml
          subPath: sso.xml
      ports:
        - containerPort: 9443

  volumes:
    - name: realm-config
      configMap:
        name: keycloak-realm
    - name: sso-override
      configMap:
        name: liberty-sso-dev
---
# ConfigMap holding the dev sso.xml — points mpJwt at the Keycloak sidecar on localhost
apiVersion: v1
kind: ConfigMap
metadata:
  name: liberty-sso-dev
data:
  sso.xml: |
    <server>
      <variable name="MP_JWT_ISSUER"   defaultValue="http://localhost:8080/realms/liberty"/>
      <variable name="MP_JWT_JWKS_URI" defaultValue="http://localhost:8080/realms/liberty/protocol/openid-connect/certs"/>
      <mpJwt id="mpJwtConfig"
             issuer="${MP_JWT_ISSUER}"
             jwksUri="${MP_JWT_JWKS_URI}"
             audiences="IGNORE"/>
    </server>
